<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to GLM & COCI+</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b0f17; }
        
        
        .wrapper { display: flex; width: 100%; height: 100%; }
        .split-zone { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-decoration: none; transition: all 0.5s ease; position: relative; padding: 40px; }
        
        
        .split-zone::after { content: ''; position: absolute; top: 15%; bottom: 15%; width: 1px; background: rgba(255,255,255,0.08); }
        .glm-zone::after { right: 0; }
        .coci-zone::after { left: 0; }

        
        .glm-zone { background: linear-gradient(135deg, #09121f 0%, #0f1c2e 100%); }
        .coci-zone { background: linear-gradient(135deg, #09120e 0%, #111e16 100%); }
        
        
        .split-zone:hover { flex: 1.15; }
        .glm-zone:hover { box-shadow: inset 0 0 100px rgba(52, 152, 219, 0.15); }
        .coci-zone:hover { box-shadow: inset 0 0 100px rgba(46, 204, 113, 0.15); }

        
        .brand-logo { font-size: 3.5rem; font-weight: bold; color: #ffffff; letter-spacing: 2px; margin-bottom: 10px; transition: transform 0.3s; }
        .brand-sub { font-size: 1.2rem; font-weight: 500; margin-bottom: 40px; letter-spacing: 1px; }
        
        .glm-zone .brand-sub { color: #3498db; }
        .coci-zone .brand-sub { color: #2ecc71; }
        
        
        .enter-btn { padding: 12px 35px; font-size: 1rem; font-weight: bold; background: transparent; border-radius: 25px; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        
        .glm-zone .enter-btn { border: 1px solid #3498db; color: #3498db; }
        .glm-zone:hover .enter-btn { background: #3498db; color: #0f1c2e; box-shadow: 0 0 20px rgba(52, 152, 219, 0.4); }
        
        .coci-zone .enter-btn { border: 1px solid #2ecc71; color: #2ecc71; }
        .coci-zone:hover .enter-btn { background: #2ecc71; color: #111e16; box-shadow: 0 0 20px rgba(46, 204, 113, 0.4); }

        
        .split-zone:hover .brand-logo { transform: translateY(-5px); }
        
        
        .footer-text { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.2); font-size: 0.85rem; pointer-events: none; }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <a href="./company-glm-en.html" class="split-zone glm-zone">
            <div class="brand-logo">GLM</div>
            <div class="brand-sub">Knowledge-Technology Convergence Lab</div>
            <div class="enter-btn">Research Hub Enter</div>
        </a>

        
        <a href="./company-coci-en.html" class="split-zone coci-zone">
            <div class="brand-logo">COCI+</div>
            <div class="brand-sub">COCI PLUS Co., Ltd.</div>
            <div class="enter-btn">Enterprise Hub Enter</div>
        </a>
    </div>

    <div class="footer-text">© 2026 CociPlus & GLM. All Rights Reserved.</div>

<a href="index.html" hreflang="ko" title="한국어로 보기" style="position:fixed;top:20px;right:25px;z-index:2000;padding:6px 16px;border:1px solid rgba(255,255,255,0.5);color:#fff;background:rgba(0,0,0,0.35);text-decoration:none;font-size:0.85rem;font-weight:bold;border-radius:20px;letter-spacing:1px;">KR</a>
</body>
</html>
